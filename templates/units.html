{% extends "base.html" %}
{% block body %}
<h1>Units</h1>
<form method="post" class="row card">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <input name="code" placeholder="Code e.g. CS301" required>
  <input name="title" placeholder="Unit title" required>
  <input name="ch" type="number" min="1" max="6" value="3" required title="Credit hours">
  <button>Add unit</button>
</form>
<table>
  <tr><th>Code</th><th>Title</th><th>Credit hours</th></tr>
  {% for u in rows %}<tr><td>{{ u.code }}</td><td>{{ u.title }}</td><td>{{ u.credit_hours }}</td></tr>{% endfor %}
</table>
{% endblock %}
