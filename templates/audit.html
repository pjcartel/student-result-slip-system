{% extends "base.html" %}
{% block body %}
<h1>Audit log</h1>
<p class="muted">The latest 200 changes: who did what, and when (UTC).</p>
<table>
  <tr><th>When (UTC)</th><th>User</th><th>Action</th><th>Details</th></tr>
  {% for r in rows %}
  <tr><td>{{ r.created_at }}</td><td>{{ r.username }}</td><td>{{ r.action }}</td><td>{{ r.details }}</td></tr>
  {% else %}<tr><td colspan="4">No changes recorded yet.</td></tr>
  {% endfor %}
</table>
{% endblock %}
